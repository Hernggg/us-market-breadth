name: Test backup EOD quote sources

on:
  push:
    paths:
      - '.github/workflows/source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sample Yahoo Finance fresh daily adjusted-close coverage
        shell: bash
        run: |
          python - <<'PY'
          import json, datetime as dt, urllib.request, urllib.error, time
          from zoneinfo import ZoneInfo
          TARGET='2026-11-19'
          PRIOR='2026-11-18'
          SYMBOLS='SPY AAPL MSFT NVDA AMZN GOOGL META TSLA BRK-B JNJ JPM XOM COST UNH HD PG KO PEP WMT MCD AMD AVGO PLTR CRM V'.split()
          successes=0
          errors=[]
          for i,symbol in enumerate(SYMBOLS,1):
              outcome=None
              for host in ['query1.finance.yahoo.com','query2.finance.yahoo.com']:
                  try:
                      u=f'https://{host}/v8/finance/chart/{symbol}?range=10d&interval=1d'
                      req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
                      with urllib.request.urlopen(req,timeout=12) as r:
                          record=json.loads(r.read(1100000).decode('utf-8'))['chart']['result'][0]
                      times=record.get('timestamp',[])
                      dates=[dt.datetime.fromtimestamp(int(t),ZoneInfo('America/New_York')).date().isoformat() for t in times]
                      adj=record.get('indicators',{}).get('adjclose',[{}])[0].get('adjclose',[])
                      pos=dates.index(TARGET) if TARGET in dates else -1
                      prev=dates.index(PRIOR) if PRIOR in dates else -1
                      valid=(pos>=0 and prev>=0 and pos<len(adj) and prev<len(adj) and adj[pos] is not None and adj[prev] is not None and adj[prev]>0)
                      outcome=('OK',round(adj[pos]/adj[prev]-1,5)) if valid else ('INCOMPLETE',dates[-1] if dates else 'NO_DATES')
                      break
                  except Exception as e:
                      outcome=('ERROR',type(e).__name__+':'+str(e)[:60])
              if outcome[0]=='OK':
                  successes+=1
              else:
                  errors.append((symbol,outcome))
              print('SAMPLE',i,symbol,*outcome,flush=True)
              time.sleep(0.14)
          print('RESULT',successes,'/',len(SYMBOLS),'have both 11/18 and 11/19 adjusted closes',flush=True)
          print('FAILURES',errors,flush=True)
          print('NOTICE: This checks data availability only, not constituent coverage, licensing, adjusted-price consistency, or full-history technical values.',flush=True)
          PY
