name: Test backup EOD quote sources

on:
  push:
    paths:
      - '.github/workflows/source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test a few symbols without changing production data
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import io
          import json
          import urllib.request
          import urllib.error
          from zoneinfo import ZoneInfo

          TARGET='2026-11-19'
          headers={'User-Agent':'Mozilla/5.0 (compatible; USMarketBreadthProbe/1.0)','Accept':'application/json,text/csv,*/*'}
          def read(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=15) as r:
                  return r.status, r.read(1500000).decode('utf-8','replace')

          print('Testing EOD availability for', TARGET, 'UTC:',dt.datetime.now(dt.timezone.utc).isoformat(),flush=True)
          yahoo_good=0
          for symbol in ['SPY','AAPL','MSFT']:
              for host in ['query1.finance.yahoo.com','query2.finance.yahoo.com']:
                  try:
                      url='https://'+host+'/v8/finance/chart/'+symbol+'?range=10d&interval=1d'
                      status,txt=read(url)
                      record=json.loads(txt)['chart']['result'][0]
                      dates=[dt.datetime.fromtimestamp(t,ZoneInfo('America/New_York')).date().isoformat() for t in record.get('timestamp',[])]
                      adj=record.get('indicators',{}).get('adjclose',[{}])[0].get('adjclose',[])
                      closes=record.get('indicators',{}).get('quote',[{}])[0].get('close',[])
                      found=TARGET in dates
                      idx=dates.index(TARGET) if found else -1
                      valid=found and idx<len(closes) and closes[idx] is not None and idx<len(adj) and adj[idx] is not None
                      yahoo_good+=int(valid)
                      print('YAHOO',symbol,'host',host,'HTTP',status,'latest',dates[-1] if dates else 'NONE','target_found',found,'adjusted_close_present',valid,flush=True)
                      break
                  except Exception as e:
                      print('YAHOO',symbol,'host',host,'FAILED',type(e).__name__,str(e)[:100],flush=True)
          try:
              u='https://stooq.com/q/d/l/?s=spy.us&i=d&d1=20261113&d2=20261120'
              status,txt=read(u)
              reader=csv.DictReader(io.StringIO(txt))
              rows=list(reader) if txt.startswith('Date,') else []
              dates=[row.get('Date') for row in rows]
              print('STOOQ SPY','HTTP',status,'CSV_rows',len(rows),'latest',dates[-1] if dates else 'NONE','target_found',TARGET in dates,flush=True)
          except Exception as e:
              print('STOOQ SPY FAILED',type(e).__name__,str(e)[:100],flush=True)
          print('RESULT Yahoo valid adjusted-close symbols:',yahoo_good,'/3; this is ONLY an access/freshness probe, not a verified broad-market data source.')
          PY
