name: Nasdaq GIW public export access feasibility
on:
  workflow_dispatch:
  push:
    paths:
      - 'nasdaq_official_export_probe.py'
      - '.github/workflows/nasdaq-official-export-probe.yml'
permissions:
  contents: read
jobs:
  check-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe unauthenticated GIW component export without saving identities
        run: python nasdaq_official_export_probe.py
