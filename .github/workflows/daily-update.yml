name: Update SP500 market breadth

on:
  schedule:
    # MYT Tue-Sat 06:23, 07:23, 08:23 (UTC schedule)
    - cron: '23 22,23 * * 1-5'
    - cron: '23 0 * * 2-6'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-update.yml'
      - 'run_cloud_update.py'
      - 'bridge_latest_session.py'
      - 'publish_summary.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -r requirements.txt
      - name: Download, recompute and publish
        run: python run_cloud_update.py
      - name: Commit public report, when updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if ! git diff --cached --quiet; then
            git commit -m "Update breadth results"
            git push
          fi
