name: Nasdaq official multi-year listed-issues history (research only)

on:
  workflow_dispatch:
  push:
    paths:
      - 'nasdaq_official_history.py'
      - 'tests/test_nasdaq_official_history.py'
      - '.github/workflows/nasdaq-official-history.yml'

permissions:
  contents: write

concurrency:
  group: nasdaq-official-history-research
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests for year transitions, annual schema and conservative checks
        run: python -m unittest discover -s tests -p 'test_nasdaq_official_history.py' -v
      - name: Download official 2024-2026 historical Nasdaq issue statistics
        run: python nasdaq_official_history.py --first-year 2024 --outdir research/nasdaq_comp
      - name: Commit research-only derived daily totals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nasdaq_comp/official_nasdaq_issues_daily_history.csv research/nasdaq_comp/official_nasdaq_issues_history_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Nasdaq official listed-issues historical archive (research)"
            git push
          fi
