name: One-shot real All-US A-D / MA / NHNL five-window validation

on:
  push:
    branches:
      - research/all-us-52w-priority-nasdaq-exchange-proxy
    paths:
      - 'research/all_us_52w/compute_full_breadth_three_json_once.py'
      - '.github/workflows/research-related-us-breadth-json-once.yml'

permissions:
  contents: read

jobs:
  schema-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute all US 60-day moving averages from three downloadable real vendor JSONs
        run: python research/all_us_52w/compute_full_breadth_three_json_once.py

# Research proof only. Must not be scheduled or republish raw third party data.
