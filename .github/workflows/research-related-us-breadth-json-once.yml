name: One-shot public US breadth JSON schema reconnaissance

on:
  push:
    branches:
      - research/all-us-52w-priority-nasdaq-exchange-proxy
    paths:
      - 'research/all_us_52w/inspect_related_public_json_once.py'
      - '.github/workflows/research-related-us-breadth-json-once.yml'

permissions:
  contents: read

jobs:
  schema-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect only JSON keys/date range, not underlying historical readings
        run: python research/all_us_52w/inspect_related_public_json_once.py

# Research proof only. Must not be scheduled or republish raw third party data.
