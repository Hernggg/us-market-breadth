name: Nasdaq Composite official component identity audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'nasdaq_comp_official_reconcile.py'
      - '.github/workflows/nasdaq-official-component-reconcile.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze 5 official historic EOD component sets and PIT directory membership
        run: python nasdaq_comp_official_reconcile.py --sessions 5
      - name: Commit counts-only reconciliation without Nasdaq constituent identities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nasdaq_comp/official_component_reconciliation.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit official Nasdaq Composite component counts against PIT candidate lists"
            git push
          fi
