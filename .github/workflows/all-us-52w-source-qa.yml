name: All-US 52W source contract QA (research only)

on:
  push:
    paths:
      - 'research/all_us_52w/**'
      - 'tests/test_all_us_52w_vendor_import.py'
      - '.github/workflows/all-us-52w-source-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test real-input historical calendar windows and Barchart encoding
        run: python -m unittest discover -s tests -p 'test_all_us_52w_vendor_import.py' -v
      - name: Verify actual public 52W history and S&P session-calendar overlap
        run: python research/all_us_52w/compute_public_history_once.py --expected-date 2026-11-24 --calendar public/sp500_pit_daily.csv

# No vendor web scraping, authentication, price storage, or GitHub main publishing.
# Only deterministic sample fixtures exercise code; no fake market results emitted.
